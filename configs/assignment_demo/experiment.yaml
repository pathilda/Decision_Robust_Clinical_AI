schema_version: 1
chunks: chunks.csv
profiles: profiles.yaml
scores:
  scale: additive complexity (1-3)
  score_min: 1
  score_max: 3
  category_weights:
    Easy to treatment: 1
    Moderate to treatment: 2
    severe to treatment: 3
  inputs:
    - id: synthetic_ai
      path: ai.csv
      id_column: patient_id
      value_column: category
      value_type: category
    - id: synthetic_anchor
      path: anchor.csv
      id_column: patient_id
      value_column: score
      value_type: numeric
    - id: synthetic_proxy
      path: proxy.csv
      id_column: patient_id
      value_column: category
      value_type: category
benchmark:
  id: synthetic_proxy
  kind: proxy
models: [synthetic_ai, synthetic_anchor]
objectives: [complexity-range, lexicographic]
selection: [random, matched, robust]
samples: 30
sample_seed: 42
robust_samples: 1
uncertainty_source: files
uncertainty_manifest: uncertainty.yaml
stress_test_manifest: heldout.yaml
regret_bounds: exact
coverage: strict
nominal_slack: 0
threads: 1
solver_seed: 0
mip_gap: 0
optimality_tolerance: 0.000001
