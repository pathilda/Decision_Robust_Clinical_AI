# Study-level settings that wrap the existing OR code (spec Sections 2.3, 7.1, 10).
schema_version: 1

load_profiles: load_profiles.yaml      # relative to this file
profile_ids: [balanced, unbalanced, highly_unbalanced]

chunks:
  size: 20
  seed: 42
  merge_remainder_below: 10            # last chunk < 10 clients is merged into the previous one

optimization:
  # Existing proxy-analysis default objective: minimize max - min final caseload complexity.
  # It is the formulation shown at rung 6; the lexicographic variant is not supported here.
  objective: complexity-range
  # Seeded optimal solutions per pool (all sources). Was 20; reduced to 10 because distribution
  # pools hit the per-solve time limit (labelled pilot, 2026-11-11).
  n_seeds: 10
  sample_seed: 42                      # existing default: selection seeds 42, 43, ..., 42+n-1
  # Absolute optimality tolerance on the objective (caseload-complexity range). The existing
  # default 1e-7 made each 20-seed pool take minutes; 0.01 is 1/20 of one class-score step (0.2).
  # It is used both as Gurobi's MIPGapAbs and as the certification tolerance.
  optimality_tolerance: 0.01
  solver_seed: 0
  threads: 1
  # Seconds per Gurobi solve. A pool whose solve hits it is saved as status "solve_failed"
  # (reported, not hidden); rerun those with a longer limit if needed.
  time_limit: 600
  # Stochastic (SAA) model for the distribution output. Existing default 20 scenarios; reduced to
  # 10 for the same reason as n_seeds. Seed and temperature are the existing defaults.
  scenario_count: 10
  scenario_seed: 42
  temperature: 1.0

evaluation:
  benchmark_seed: 1001                 # existing default reference-selection seed
