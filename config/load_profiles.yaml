# Clinician load profiles for the 5-class study, in the existing proxy-analysis profile format
# (loaded and validated by patient_assignment.proxy_inputs.profiles).
#
# DERIVED from configs/proxy_profiles.yaml (identifiers, clinician IDs, counts and capacities
# unchanged). The existing initial complexities are on the 3-class scale (weights 1..3) and are
# rejected by the existing validator against class scores 1.0..1.8. They are mapped with the
# affine map that sends weight 1 -> 1.0 and weight 3 -> 1.8 per client:
#     new_complexity = initial_count + 0.4 * (old_complexity - initial_count)
# This preserves each profile's relative imbalance. CONFIRM before the full run.
#
# capacity is the FINAL patient-count limit (existing semantics); a clinician can therefore take
# at most capacity - initial_count new clients.
schema_version: 1
profiles:
  balanced:
    clinicians:
      - {id: A, initial_count: 10, initial_complexity: 14.0, capacity: 25}
      - {id: B, initial_count: 10, initial_complexity: 14.0, capacity: 25}
      - {id: C, initial_count: 10, initial_complexity: 14.0, capacity: 25}
  unbalanced:
    clinicians:
      - {id: A, initial_count: 10, initial_complexity: 12.0, capacity: 25}
      - {id: B, initial_count: 10, initial_complexity: 14.0, capacity: 25}
      - {id: C, initial_count: 10, initial_complexity: 16.0, capacity: 25}
  highly_unbalanced:
    clinicians:
      - {id: A, initial_count: 10, initial_complexity: 10.0, capacity: 25}
      - {id: B, initial_count: 10, initial_complexity: 14.0, capacity: 25}
      - {id: C, initial_count: 10, initial_complexity: 18.0, capacity: 25}
