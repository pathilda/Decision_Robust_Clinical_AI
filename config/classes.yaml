# Complexity classes for the Decision Robust inference study.
# Single source of truth: prompts, parsing and the OR stage all read this file.
# Definitions (v2, 2026-11-09) are copied verbatim from the clinical team's class table
# (Description + Typical Therapy Plan); only spreadsheet quoting artifacts were removed.
schema_version: 2

# Abbreviations used in the class table. Entries left as null are placeholders: they are NOT
# rendered into prompts until filled in. Filling one changes every rating, allocation and
# tie-break prompt (new prompt hashes), so fill them before the full run.
abbreviations:
  KA: null   # placeholder: expansion pending from the clinical team
  HP: null   # placeholder: expansion pending from the clinical team
  HCP: "health care provider"

classes:
  - id: 1
    score: 1.0
    definition:
      - "Client with mild/moderate needs in 1 area that has a therapy plan that is generally straightforward."
    typical_therapy_plan: "For purposes of KA, children will likely be placed on group therapy or receive a home program."
  - id: 2
    score: 1.2
    definition:
      - "Client with moderate+ needs in 1 area that has a therapy plan that is generally straightforward. Alternatively, a client may present with class 1 needs but there are barriers that have been identified in the contextual/environmental factors. Examples include - support and relationship limitations from caregivers, identified attitudes towards disability/health condition, access to therapy and caregiver capacity."
    typical_therapy_plan: "placed in group therapy; exceptions may include HP, on hold or individual/modified dyad."
  - id: 3
    score: 1.4
    definition:
      - "Client with needs in multiple domains where the therapy plan may be modifiable based on changing needs. Client with significant needs in one domain where the therapy plan may require additional time (e.g., motor speech). Client may present with moderate+ needs that is generally straightforward but there are some barriers that have been identified e.g., transportation, caregiver capacity etc"
    typical_therapy_plan: "For purposes of KA, children may be placed in group therapy but individualized therapy also a strong possibility."
  - id: 4
    score: 1.6
    definition:
      - "Client with needs in multiple domains where the therapy plan should be coordinated with additional HCPs and/or disciplines. This can include clients where there is PT and or OT involvement. Can include known diagnoses (e.g., ASD, ADHD, Treacher Collins, etc) Alternatively, a client may present with class 3 needs but there are barriers that have been identified in the contextual/environmental factors. Examples include - support and relationship limitations from caregivers, identified attitudes towards disability/health condition, access to therapy and caregiver capacity. May also include \"very complex\" clients who are demonstrating strong skills in SLP domain but overall are complex (e.g., spina bifida) to highlight the level of coordination."
    typical_therapy_plan: "group, team/joint or 1:1"
  - id: 5
    score: 1.8
    definition:
      - "Very complex where there are multiple domains, including significant needs around consultation with specialists over extended period of time. Examples include: children with diagnosed or suspected genetic/biological conditions that impact multiple subsystems. These children may be accessing services with multiple agencies e.g., hospital, specialists (e.g., orthopedic surgeons, respirologists, home nursing, etc)."
    typical_therapy_plan: "joint, team or 1:1 (often team/joint)"
