# Models, local paths and serving/sampling settings (spec Section 1).
# Checkpoints live in <--models-dir>/<key>/ (key = the names below); the commit hash of
# each download is read from <--models-dir>/<key>/REVISION.
schema_version: 1

models:
  qwen35-4b:
    hf_id: Qwen/Qwen3.5-4B
    family: qwen
    # Qwen3.5 thinks by default; its template switches on this exact kwarg.
    chat_template_kwargs: {enable_thinking: false}
    # Qwen3.5's linear-attention (GDN) layers default to a FlashInfer kernel that is
    # JIT-compiled with nvcc; the Triton kernel needs no CUDA toolkit on the node.
    engine_kwargs: {gdn_prefill_backend: triton}
  qwen35-27b:
    hf_id: Qwen/Qwen3.5-27B
    family: qwen
    chat_template_kwargs: {enable_thinking: false}
    # Each in-flight sequence needs one linear-attention state block; after the 50 GB of
    # weights an H100 holds only ~340, below vLLM's default max_num_seqs of 1024. Real
    # concurrency is KV-bound well below 256, so this cap does not slow anything down.
    engine_kwargs: {gdn_prefill_backend: triton, max_num_seqs: 256}
  medgemma-4b:
    hf_id: google/medgemma-4b-it
    family: medgemma
    chat_template_kwargs: {}
  medgemma-27b:
    hf_id: google/medgemma-27b-text-it
    family: medgemma
    chat_template_kwargs: {}

serving:
  dtype: bfloat16
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  enable_prefix_caching: true
  # Applied only to checkpoints whose config.json declares a vision tower.
  limit_mm_per_prompt: {image: 0, video: 0}
  kv_cache_dtype: auto
  # Compact JSON: without this the grammar allows unlimited whitespace between tokens and
  # greedy decoding (seen with medgemma-4b) can emit newlines until max_tokens. vLLM only
  # supports this option with an explicit xgrammar or guidance backend (not "auto").
  structured_outputs: {backend: xgrammar, disable_any_whitespace: true}
  seed: 1234
  tensor_parallel_size: 1

sampling:
  temperature: 0.0
  top_p: 1.0
  seed: 1234

max_new_tokens:
  icf: 4096
  rating: 1024
  allocation: 3072
  tiebreak: 1024
