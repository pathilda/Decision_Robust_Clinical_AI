[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-target-extraction"
version = "0.4.0"
description = "Rolling-profile, auditable clinical-target extraction from de-identified notes"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "transformers>=4.45",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
parquet = ["pyarrow>=14"]

[project.scripts]
clinical-target-extraction = "clinical_target_extraction.src.cli:main"

[tool.setuptools.packages.find]
include = ["clinical_target_extraction*"]

[tool.setuptools.package-data]
clinical_target_extraction = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["clinical_target_extraction/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
