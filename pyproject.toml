[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-treatment-classification"
version = "1.0.0"
description = "Client-level treatment-difficulty classification from de-identified pre-treatment text"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.7",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "transformers>=4.45",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
parquet = ["pyarrow>=14"]
opendecider = ["opendecider[small]>=0.1.2"]

[project.scripts]
clinical-treatment-classification = "clinical_target_extraction.src.cli:main"
clinical-opendecider = "opendecider_inference.cli:main"

[tool.setuptools.packages.find]
include = ["clinical_target_extraction*", "opendecider_inference*"]

[tool.setuptools.package-data]
clinical_target_extraction = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["clinical_target_extraction/tests", "opendecider_inference/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
