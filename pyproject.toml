[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-target-extraction"
version = "0.1.0"
description = "Sequential, auditable clinical-target extraction from de-identified notes"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "pandas>=2.0",
  "pyarrow>=14",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clinical-target-extraction = "clinical_target_extraction.src.run_extraction:main"

[tool.setuptools.packages.find]
include = ["clinical_target_extraction*"]

[tool.setuptools.package-data]
clinical_target_extraction = ["prompts/*.txt", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["clinical_target_extraction/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
